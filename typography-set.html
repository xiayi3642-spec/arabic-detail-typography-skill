<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>@font-face{font-family:Almarai;src:url('./fonts/Almarai-Light.ttf') format('truetype');font-weight:300;font-style:normal;font-display:block}
@font-face{font-family:Almarai;src:url('./fonts/Almarai-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:Almarai;src:url('./fonts/Almarai-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:block}
@font-face{font-family:Almarai;src:url('./fonts/Almarai-ExtraBold.ttf') format('truetype');font-weight:800;font-style:normal;font-display:block}
@font-face{font-family:"Stay Dreaming";src:url('./fonts/Stay-Dreaming.otf') format('opentype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Arabic Editorial";src:url('./fonts/ae_AlYermook.ttf') format('truetype');font-weight:400;font-style:normal;font-display:block}

:root{--w:1000px;--h:1000px;--ink:#573725;--muted:#8a776b;--accent:#d8a044;--safe:68px;--title-size:66px;--subtitle-size:37px}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Almarai,Arial,sans-serif;font-synthesis:none}
body{display:grid;grid-template-columns:repeat(2,var(--w));gap:36px;padding:36px;background:#dedbd5}
body.capture{display:block;padding:0;background:transparent}
body.capture .canvas{display:none}
body.capture .canvas.capture-target{display:block;box-shadow:none}
.canvas{position:relative;width:var(--w);height:var(--h);overflow:visible;background:transparent;color:var(--ink);direction:rtl;isolation:isolate;box-shadow:0 16px 44px rgba(30,20,10,.14)}
.safe{position:absolute;inset:var(--safe)}
.title,.subtitle,.icon-label{margin:0}
.title{font-size:var(--title-size);font-weight:800;line-height:1.38;letter-spacing:0;text-align:right;color:var(--ink)}
.title .line,.subtitle .line{display:block;white-space:nowrap}
.subtitle{font-size:var(--subtitle-size);font-weight:400;line-height:1.65;letter-spacing:0;text-align:right;color:var(--muted)}
.highlight{color:var(--accent)}
.style-serif .title{font-family:"Arabic Editorial","DecoType Naskh",serif;font-size:78px;font-weight:400;line-height:1.28}
.style-serif .subtitle{font-family:Almarai,Arial,sans-serif}
.latin-accent{position:absolute;display:none;direction:ltr;font-family:"Stay Dreaming",cursive;font-size:62px;font-weight:400;line-height:1;color:var(--accent);opacity:.7;white-space:nowrap}
.style-serif .latin-accent{display:block}
.rule-diamond,.rule-double{display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr;color:var(--accent)}
.rule-diamond::before,.rule-diamond::after,.rule-double::before,.rule-double::after{content:"";display:block;width:95px;height:1px;background:currentColor;opacity:.72}
.diamond{width:16px;height:16px;border:2px solid currentColor;transform:rotate(45deg)}
.rule-double .diamond+ .diamond{margin-left:-23px}
.orb{position:absolute;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle at 28% 28%,color-mix(in srgb,var(--accent) 92%,white),color-mix(in srgb,var(--accent) 54%,transparent) 48%,transparent 72%);opacity:.72;filter:blur(.2px);z-index:0}
.sparkle-cluster{position:absolute;width:90px;height:70px;color:var(--accent)}
.sparkle-cluster::before,.sparkle-cluster::after{content:"✦";position:absolute;font-size:31px;line-height:1}.sparkle-cluster::before{right:0;top:0}.sparkle-cluster::after{left:8px;bottom:0;font-size:17px;opacity:.55}

.hero-icons .title{position:absolute;top:176px;right:0;width:820px;z-index:2}
.hero-icons .subtitle{position:absolute;top:385px;right:0;width:760px}
.hero-icons .sparkle-cluster{top:142px;left:46px}
.hero-icons .latin-accent{top:334px;right:230px;z-index:1}
.hero-icons .icon-row{position:absolute;right:0;left:0;bottom:90px;display:grid;grid-template-columns:repeat(var(--icon-count),minmax(0,1fr));gap:26px;direction:rtl}
.hero-icons .icon-item{min-width:0;text-align:center;color:var(--ink)}
.hero-icons .icon{display:grid;place-items:center;width:72px;height:72px;margin:0 auto 18px;border:1.5px solid color-mix(in srgb,var(--accent) 78%,transparent);border-radius:50%;color:var(--accent)}
.hero-icons .icon svg{width:40px;height:40px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hero-icons .icon-label{font-size:23px;font-weight:700;line-height:1.45;color:var(--muted)}

.center-divider .title{position:absolute;top:225px;right:70px;width:792px;text-align:center}
.center-divider .subtitle{position:absolute;top:485px;right:95px;width:742px;text-align:center}
.center-divider .rule-diamond{position:absolute;top:425px;right:286px;width:360px}
.center-divider .latin-accent{top:386px;right:300px}

.side-orb .title{position:absolute;top:230px;right:22px;width:825px;z-index:2}
.side-orb .subtitle{position:absolute;top:470px;right:22px;width:760px;z-index:2}
.side-orb .orb{top:170px;left:48px}
.side-orb .rule-diamond{position:absolute;top:620px;right:22px;justify-content:flex-start}
.side-orb .latin-accent{top:418px;right:250px;z-index:1}

.minimal-mark .title{position:absolute;top:222px;right:70px;width:792px;text-align:center}
.minimal-mark .rule-double{position:absolute;top:420px;right:286px;width:360px}
.minimal-mark .subtitle{position:absolute;top:500px;right:95px;width:742px;text-align:center}
.minimal-mark .latin-accent{top:382px;right:315px}

.title-long .title{font-size:62px;font-weight:700}
.title-long .subtitle{font-size:35px}


:root{--w:1000px;--h:1000px;--ink:#573725;--muted:#8A776B;--accent:#D8A044}</style>
</head><body><section class="canvas hero-icons title-normal style-sans" data-id="01-hero" data-template="hero-icons"><div class="safe"><h1 class="title"><span class="line">مجموعة مصابيح</span><span class="line"><span class="highlight">كريستالية</span> <span class="highlight">للأجواء</span></span></h1><p class="subtitle"><span class="line">إضاءة دافئة تناسب كل مساحة</span></p><span class="sparkle-cluster" aria-hidden="true"></span><div class="icon-row" style="--icon-count:3">
    <article class="icon-item">
      <span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M16 20a8 8 0 1 1 16 0c0 4-2 6-4.5 8.5V32h-7v-3.5C18 26 16 24 16 20Z"/><path d="M20 36h8M21.5 40h5"/></svg></span>
      <p class="icon-label"><bdi>٤ مصابيح</bdi></p>
    </article>
    <article class="icon-item">
      <span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="16" cy="18" r="6"/><rect x="26" y="12" width="12" height="12" rx="2"/><path d="m14 36 7-10 7 10Z"/></svg></span>
      <p class="icon-label"><bdi>٣ تصاميم</bdi></p>
    </article>
    <article class="icon-item">
      <span class="icon"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="m24 8 2.6 8.4L35 19l-8.4 2.6L24 30l-2.6-8.4L13 19l8.4-2.6Z"/><path d="m37 29 1.4 4.6L43 35l-4.6 1.4L37 41l-1.4-4.6L31 35l4.6-1.4Z"/></svg></span>
      <p class="icon-label"><bdi>أجواء متعددة</bdi></p>
    </article></div></div></section>
<section class="canvas center-divider title-normal style-sans" data-id="02-atmosphere" data-template="center-divider"><div class="safe"><h1 class="title"><span class="line">وهج <span class="highlight">هادئ</span></span><span class="line">يغيّر أجواء المكان</span></h1><span class="rule-diamond" aria-hidden="true"><i class="diamond"></i></span><p class="subtitle"><span class="line">إضاءة ناعمة تضيف <span class="highlight">الدفء</span> والراحة</span></p></div></section>
<section class="canvas side-orb title-normal style-sans" data-id="03-crystal" data-template="side-orb"><div class="safe"><span class="orb" aria-hidden="true"></span><h1 class="title"><span class="line">تفاصيل <span class="highlight">كريستالية</span></span><span class="line">تلتقط الضوء</span></h1><p class="subtitle"><span class="line">لمعان رقيق يضيف لمسة <span class="highlight">أنيقة</span></span></p><span class="rule-diamond" aria-hidden="true"><i class="diamond"></i></span></div></section>
<section class="canvas minimal-mark title-normal style-sans" data-id="04-flexible" data-template="minimal-mark"><div class="safe"><h1 class="title"><span class="line">ضوء يناسب</span><span class="line">لحظاتك <span class="highlight">المختلفة</span></span></h1><span class="rule-double" aria-hidden="true"><i class="diamond"></i><i class="diamond"></i></span><p class="subtitle"><span class="line">من الهدوء اليومي إلى اللقاءات <span class="highlight">الدافئة</span></span></p></div></section></body></html>
